<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>NEON FLOW • 3D productivity</title>
  <style>
    /* ----- RESET & BASE (mobile-first) ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: #0b0e14;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #eef5ff;
      transition: background 0.25s ease;
      padding: 0;
      margin: 0;
    }

    #app {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: opacity 0.2s;
    }

    body.fullscreen-active {
      background: #000 !important;
    }

    body.fullscreen-active #app {
      display: none !important;
    }

    #fullscreen-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      backdrop-filter: blur(2px);
      padding: 1rem;
    }

    body.fullscreen-active #fullscreen-overlay {
      display: flex;
    }

    .neon-text {
      text-shadow: 0 0 12px rgba(0, 255, 255, 0.7), 0 0 30px rgba(0, 180, 255, 0.4);
    }

    .glass-panel {
      background: rgba(18, 25, 35, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 255, 255, 0.15);
      border-radius: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(0, 255, 200, 0.1) inset;
      padding: 1.25rem;
    }

    /* Mobile-optimized header */
    .header-row {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    @media (min-width: 640px) {
      .header-row {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
      #app { padding: 1.5rem; gap: 2rem; }
      .glass-panel { padding: 1.5rem 1.8rem; border-radius: 2.5rem; }
    }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }

    .current-active-badge {
      background: #0f1a24;
      padding: 0.5rem 1rem;
      border-radius: 60px;
      border-left: 4px solid #0ff;
      box-shadow: 0 0 15px #00ffff55;
      font-weight: 500;
      font-size: 0.85rem;
      flex: 1;
      min-width: 180px;
    }

    .time-format-toggle {
      display: flex;
      gap: 0.25rem;
      background: #0f1a24;
      padding: 0.25rem;
      border-radius: 60px;
      border: 1px solid #2a4a5a;
    }

    .format-btn {
      padding: 0.4rem 1rem;
      border-radius: 40px;
      background: transparent;
      border: none;
      color: #b0c7de;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      box-shadow: none;
      min-height: 44px;
      min-width: 60px;
    }

    .format-btn.active {
      background: #0ff2;
      color: #0ff;
      box-shadow: 0 0 10px cyan;
    }

    /* Timeline - horizontal scroll optimized for touch */
    .timeline-container {
      overflow-x: auto;
      overflow-y: visible;
      padding: 0.5rem 0;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #0ff #1a2a3a;
    }

    .timeline-container::-webkit-scrollbar {
      height: 4px;
    }

    .timeline-container::-webkit-scrollbar-thumb {
      background: #0ff;
      border-radius: 10px;
    }

    .timeline-track {
      display: flex;
      gap: 0.75rem;
      min-width: max-content;
      padding: 0.25rem;
    }

    .timeline-card {
      background: rgba(12, 20, 28, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 1.2rem;
      padding: 0.9rem 1.2rem;
      min-width: 160px;
      border: 1px solid #2a3a4a;
      box-shadow: 0 4px 0 #00000030;
      transition: all 0.15s;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .timeline-card:active {
      transform: scale(0.98);
    }

    .timeline-card.work { border-left: 6px solid #3b82f6; box-shadow: 0 0 12px #3b82f670; }
    .timeline-card.rest { border-left: 6px solid #10b981; box-shadow: 0 0 12px #10b98170; }
    .timeline-card.sleep { border-left: 6px solid #8b5cf6; box-shadow: 0 0 12px #8b5cf670; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ff5e7c;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 8px;
      opacity: 0.8;
      transition: 0.2s;
      min-height: 44px;
      min-width: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .delete-btn:active { opacity: 1; text-shadow: 0 0 10px red; }

    /* Form - mobile stacked */
    .alarm-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    @media (min-width: 768px) {
      .alarm-form {
        flex-direction: row;
        flex-wrap: wrap;
        align-items: flex-end;
      }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      flex: 1;
      min-width: 140px;
    }

    .input-group label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #9bb7dd;
    }

    input, select, button {
      background: #0f1a24;
      border: 1px solid #2e4b62;
      border-radius: 2rem;
      padding: 0.8rem 1rem;
      color: white;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
      -webkit-appearance: none;
      min-height: 48px;
    }

    input:focus, select:focus {
      border-color: #0ff;
      box-shadow: 0 0 15px #0ff3;
    }

    button {
      background: #0b1c2b;
      border: 1px solid #0ff;
      color: #e0f2fe;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 10px #00ffff33;
      padding: 0.8rem 1.5rem;
      min-height: 48px;
      -webkit-tap-highlight-color: transparent;
    }

    button.primary {
      background: #0066ff20;
      border: 1.5px solid #0ff;
      box-shadow: 0 0 20px #0ff5;
      font-size: 1rem;
    }

    button:active {
      background: #1e3a5f;
      border-color: #7ff;
      transform: scale(0.97);
    }

    /* Fullscreen clock mobile optimized */
    .fullscreen-clock-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      width: 100%;
      max-width: 500px;
    }

    .digital-clock-main {
      font-size: clamp(2.5rem, 15vw, 6rem);
      font-weight: 300;
      letter-spacing: 4px;
      color: #b3f0ff;
      text-shadow: 0 0 30px cyan, 0 0 60px blue;
      font-variant-numeric: tabular-nums;
    }

    .clock-ampm {
      font-size: clamp(1.2rem, 5vw, 2rem);
      margin-left: 0.5rem;
      font-weight: 300;
      opacity: 0.8;
    }

    .canvas-3d-container {
      position: relative;
      width: min(280px, 70vw);
      height: min(280px, 70vw);
      margin: 0.5rem auto;
    }

    #timer-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      filter: drop-shadow(0 0 25px #0ff) drop-shadow(0 0 8px #0ff);
    }

    .countdown-digits {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(2rem, 10vw, 3.5rem);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: #fff;
      text-shadow: 0 0 30px #0ff, 0 0 60px #0ff;
      letter-spacing: 4px;
      pointer-events: none;
    }

    .session-label-fs {
      font-size: clamp(1.2rem, 6vw, 1.8rem);
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #a0ecff;
      text-align: center;
    }

    .next-alarm-hint {
      margin-top: 0.5rem;
      font-size: clamp(0.9rem, 4vw, 1.2rem);
      opacity: 0.8;
      text-align: center;
      padding: 0 1rem;
    }

    #exitFullscreenBtn {
      margin-top: 1rem;
      background: transparent;
      border-color: #555;
      min-height: 48px;
      padding: 0.8rem 2rem;
    }

    #flash-overlay {
      position: fixed;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 10000;
      transition: opacity 0.1s;
    }

    .flash-active {
      animation: flashBang 0.6s ease-out;
    }

    @keyframes flashBang {
      0% { opacity: 0.9; background: #aaffff; }
      70% { opacity: 0.3; }
      100% { opacity: 0; }
    }

    /* Helper text */
    .hint-text {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      opacity: 0.6;
      text-align: center;
    }

    /* Fix for mobile tap highlight */
    * {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header-row glass-panel">
      <h1 class="neon-text" style="font-weight: 300; font-size: clamp(1.5rem, 6vw, 2rem);">⚡ FOCUS<span style="font-weight: 700;">FLOW</span></h1>
      <div class="header-controls">
        <div class="time-format-toggle" id="formatToggle">
          <button class="format-btn active" data-format="24">24h</button>
          <button class="format-btn" data-format="12">12h</button>
        </div>
        <div class="current-active-badge" id="activeSessionDisplay">⚪ No active session</div>
      </div>
    </div>

    <div class="glass-panel">
      <h2 style="margin-bottom: 0.75rem; font-size: clamp(1.1rem, 5vw, 1.5rem);">📋 Today's timeline</h2>
      <div class="timeline-container">
        <div class="timeline-track" id="timelineTrack"></div>
      </div>
      <div class="hint-text">← swipe → · double‑tap card to start</div>
    </div>

    <div class="glass-panel">
      <h3 style="margin-bottom: 1rem; font-size: clamp(1rem, 5vw, 1.3rem);">➕ Schedule alarm</h3>
      <div class="alarm-form">
        <div class="input-group">
          <label>⏰ Start (24h)</label>
          <input type="time" id="startTimeInput" value="09:00" step="60">
        </div>
        <div class="input-group">
          <label>⏱️ Duration (min)</label>
          <input type="number" id="durationInput" value="25" min="1" max="480" step="1" inputmode="numeric">
        </div>
        <div class="input-group">
          <label>📌 Category</label>
          <select id="categorySelect">
            <option value="work" selected>💼 Work</option>
            <option value="rest">☕ Rest</option>
            <option value="sleep">🌙 Sleep</option>
          </select>
        </div>
        <div class="input-group">
          <label>🏷️ Label</label>
          <input type="text" id="labelInput" value="Deep focus" placeholder="Study session">
        </div>
        <button class="primary" id="addAlarmBtn">+ Add alarm</button>
      </div>
    </div>
  </div>

  <!-- FULLSCREEN OVERLAY -->
  <div id="fullscreen-overlay">
    <div class="fullscreen-clock-wrap">
      <div class="session-label-fs" id="fsCategoryLabel">WORK</div>
      <div style="display: flex; align-items: baseline; justify-content: center;">
        <div class="digital-clock-main" id="fsDigitalClock">22:45</div>
        <span class="clock-ampm" id="fsAmpm"></span>
      </div>
      <div class="canvas-3d-container">
        <canvas id="timer-canvas" width="400" height="400"></canvas>
        <div class="countdown-digits" id="fsCountdownText">25:00</div>
      </div>
      <div class="next-alarm-hint" id="nextAlarmInfo">Next: —</div>
      <button id="exitFullscreenBtn">✕ Exit fullscreen</button>
    </div>
  </div>

  <div id="flash-overlay"></div>
  <audio id="alarmSound" preload="auto">
    <source src="data:audio/wav;base64,UklGRlwAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YVoAAACAgICAf39/f39/f3+AgICAf39/f39/f3+AgICAf39/f39/f3+AgICAf39/f39/f3+AgICAf39/f39/f38=" type="audio/wav">
  </audio>
  
  <script>
    (function(){
      "use strict";

      // ---------- STATE ----------
      let alarms = [];
      let activeAlarmId = null;
      let timerInterval = null;
      let currentCountdownSeconds = 0;
      let canvasCtx, canvas;
      let rotationAngle = 0;
      let animationFrame = null;
      let clockFormat = '24';
      
      // DOM elements
      const timelineTrack = document.getElementById('timelineTrack');
      const activeSessionDisplay = document.getElementById('activeSessionDisplay');
      const startTimeInput = document.getElementById('startTimeInput');
      const durationInput = document.getElementById('durationInput');
      const categorySelect = document.getElementById('categorySelect');
      const labelInput = document.getElementById('labelInput');
      const addBtn = document.getElementById('addAlarmBtn');
      const fullscreenOverlay = document.getElementById('fullscreen-overlay');
      const fsDigitalClock = document.getElementById('fsDigitalClock');
      const fsAmpm = document.getElementById('fsAmpm');
      const fsCountdownText = document.getElementById('fsCountdownText');
      const fsCategoryLabel = document.getElementById('fsCategoryLabel');
      const nextAlarmInfo = document.getElementById('nextAlarmInfo');
      const exitFullscreenBtn = document.getElementById('exitFullscreenBtn');
      const flashOverlay = document.getElementById('flash-overlay');
      const alarmAudio = document.getElementById('alarmSound');
      const formatBtns = document.querySelectorAll('.format-btn');
      
      canvas = document.getElementById('timer-canvas');
      canvasCtx = canvas.getContext('2d');

      // Helper functions
      function formatTimeWithFormat(date, format = clockFormat) {
        if (format === '24') {
          return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
        }
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
      }

      function parseTimeToDate(timeStr) {
        const [h, m] = timeStr.split(':').map(Number);
        const d = new Date();
        d.setHours(h, m, 0, 0);
        return d;
      }

      function sortAlarms() {
        alarms.sort((a, b) => parseTimeToDate(a.start) - parseTimeToDate(b.start));
      }

      function formatCountdown(sec) {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      }

      // Render timeline with touch-friendly cards
      function renderTimeline() {
        if (!timelineTrack) return;
        if (alarms.length === 0) {
          timelineTrack.innerHTML = '<div class="timeline-card" style="opacity:0.6; display: flex; align-items: center; justify-content: center;">✨ Tap + to add ✨</div>';
          return;
        }
        let html = '';
        alarms.forEach(alarm => {
          const timeDate = parseTimeToDate(alarm.start);
          const displayTime = formatTimeWithFormat(timeDate);
          html += `<div class="timeline-card ${alarm.category}" data-id="${alarm.id}">
            <div class="card-header">
              <span>${displayTime}</span>
              <button class="delete-btn" data-id="${alarm.id}" aria-label="Delete">✕</button>
            </div>
            <div style="font-weight: 500;">${alarm.label}</div>
            <div style="font-size:0.8rem; opacity:0.8;">${alarm.durationMin}m · ${alarm.category}</div>
          </div>`;
        });
        timelineTrack.innerHTML = html;
        
        // Delete listeners
        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = Number(btn.dataset.id);
            if (confirm('Delete this alarm?')) {
              deleteAlarmById(id);
            }
          });
        });
        
        attachTimelineStartListeners();
      }

      function deleteAlarmById(id) {
        if (activeAlarmId === id) stopActiveAlarm();
        alarms = alarms.filter(a => a.id !== id);
        sortAlarms();
        renderTimeline();
        updateActiveBadge();
        updateNextAlarmDisplay();
        saveToLocal();
      }

      function updateActiveBadge() {
        if (activeAlarmId !== null) {
          const active = alarms.find(a => a.id === activeAlarmId);
          if (active) {
            activeSessionDisplay.innerHTML = `⚡ ${active.category} · ${active.label} · ${formatCountdown(currentCountdownSeconds)}`;
            return;
          }
          activeAlarmId = null;
        }
        activeSessionDisplay.innerHTML = '⚪ No active session';
      }

      function stopActiveAlarm() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = null;
        if (animationFrame) cancelAnimationFrame(animationFrame);
        animationFrame = null;
        activeAlarmId = null;
        exitFullscreenMode();
        updateActiveBadge();
      }

      function startAlarm(alarm) {
        if (activeAlarmId === alarm.id) return;
        if (activeAlarmId !== null) stopActiveAlarm();
        
        activeAlarmId = alarm.id;
        currentCountdownSeconds = alarm.durationMin * 60;
        fsCategoryLabel.textContent = `${alarm.category.toUpperCase()} · ${alarm.label}`;
        updateFullscreenCountdownText();
        enterFullscreenMode();
        
        timerInterval = setInterval(() => {
          if (currentCountdownSeconds <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            triggerAlarmEnd(alarm);
            return;
          }
          currentCountdownSeconds--;
          updateFullscreenCountdownText();
          updateActiveBadge();
        }, 1000);
        
        function drawLoop() {
          draw3DRing(currentCountdownSeconds, alarm.durationMin * 60);
          rotationAngle += 0.012;
          animationFrame = requestAnimationFrame(drawLoop);
        }
        drawLoop();
        
        updateActiveBadge();
        updateNextAlarmDisplay();
      }

      function triggerAlarmEnd(alarm) {
        try { 
          alarmAudio.currentTime = 0; 
          alarmAudio.play().catch(() => {});
        } catch(e) {}
        
        flashOverlay.classList.add('flash-active');
        setTimeout(() => flashOverlay.classList.remove('flash-active'), 600);
        
        if (Notification.permission === 'granted') {
          new Notification(`⏰ ${alarm.label} finished`, { 
            body: `${alarm.category} session ended`,
            silent: false
          });
        }
        
        stopActiveAlarm();
        deleteAlarmById(alarm.id);
        renderTimeline();
      }

      function updateFullscreenCountdownText() {
        fsCountdownText.textContent = formatCountdown(currentCountdownSeconds);
      }

      function updateDigitalClockFS() {
        const now = new Date();
        if (clockFormat === '24') {
          fsDigitalClock.textContent = now.toLocaleTimeString([], { 
            hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false 
          });
          fsAmpm.textContent = '';
        } else {
          const timeStr = now.toLocaleTimeString([], { 
            hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true 
          });
          const parts = timeStr.split(' ');
          fsDigitalClock.textContent = parts[0];
          fsAmpm.textContent = parts[1] || '';
        }
      }

      function enterFullscreenMode() {
        document.body.classList.add('fullscreen-active');
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
        updateDigitalClockFS();
        window.fsClockInterval = setInterval(() => updateDigitalClockFS(), 500);
      }

      function exitFullscreenMode() {
        document.body.classList.remove('fullscreen-active');
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
        if (window.fsClockInterval) clearInterval(window.fsClockInterval);
        if (animationFrame) cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }

      function updateNextAlarmDisplay() {
        const now = new Date();
        const upcoming = alarms.filter(a => parseTimeToDate(a.start) > now);
        if (upcoming.length) {
          const n = upcoming[0];
          const timeDisp = formatTimeWithFormat(parseTimeToDate(n.start));
          nextAlarmInfo.textContent = `Next: ${timeDisp} · ${n.label} (${n.category})`;
        } else {
          nextAlarmInfo.textContent = '✨ No more alarms today';
        }
      }

      function draw3DRing(currentSec, totalSec) {
        const ctx = canvasCtx;
        const w = 400, h = 400;
        canvas.width = w; canvas.height = h;
        ctx.clearRect(0, 0, w, h);
        
        const progress = Math.max(0, 1 - (currentSec / totalSec));
        const cx = w/2, cy = h/2, radius = 130;
        
        for (let layer = 3; layer >= 0; layer--) {
          const off = layer * 3;
          ctx.beginPath();
          ctx.arc(cx, cy, radius + off * 0.7, 0, Math.PI * 2 * progress);
          ctx.lineWidth = 10 - layer * 1.5;
          ctx.lineCap = 'round';
          
          const grad = ctx.createConicGradient(rotationAngle + layer * 0.3, cx, cy);
          grad.addColorStop(0, '#0ff');
          grad.addColorStop(0.5, '#3b82f6');
          grad.addColorStop(1, '#a78bfa');
          
          ctx.strokeStyle = grad;
          ctx.shadowColor = '#0ff';
          ctx.shadowBlur = 20 + layer * 6;
          ctx.stroke();
        }
        
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#1a3344';
        ctx.shadowBlur = 0;
        ctx.stroke();
        
        ctx.save();
        ctx.translate(cx + 30 * Math.cos(rotationAngle * 2), cy + 30 * Math.sin(rotationAngle * 1.3));
        ctx.rotate(rotationAngle);
        ctx.fillStyle = '#0ff';
        ctx.shadowBlur = 30;
        ctx.fillRect(-8, -8, 16, 16);
        ctx.restore();
      }

      function addAlarm() {
        const start = startTimeInput.value;
        const duration = parseInt(durationInput.value, 10);
        const category = categorySelect.value;
        const label = labelInput.value.trim() || 'Session';
        
        if (!start || duration < 1) {
          alert('Please fill all fields');
          return;
        }
        
        const newAlarm = { 
          id: Date.now() + Math.floor(Math.random() * 1000), 
          start, 
          durationMin: duration, 
          category, 
          label 
        };
        
        alarms.push(newAlarm);
        sortAlarms();
        renderTimeline();
        updateNextAlarmDisplay();
        saveToLocal();
        
        // Clear form
        labelInput.value = '';
        durationInput.value = '25';
      }

      function attachTimelineStartListeners() {
        document.querySelectorAll('.timeline-card').forEach(card => {
          // Remove existing listeners to prevent duplicates
          card.removeEventListener('dblclick', handleCardDoubleClick);
          card.removeEventListener('touchend', handleCardTap);
          
          card.addEventListener('dblclick', handleCardDoubleClick);
          card.addEventListener('touchend', handleCardTap);
        });
      }

      function handleCardDoubleClick(e) {
        const card = e.currentTarget;
        const id = Number(card.dataset.id);
        const alarm = alarms.find(a => a.id === id);
        if (alarm) startAlarm(alarm);
      }

      let tapTimeout;
      function handleCardTap(e) {
        const card = e.currentTarget;
        // Prevent conflict with delete button
        if (e.target.classList.contains('delete-btn')) return;
        
        if (tapTimeout) {
          clearTimeout(tapTimeout);
          tapTimeout = null;
          // Double tap detected
          const id = Number(card.dataset.id);
          const alarm = alarms.find(a => a.id === id);
          if (alarm) startAlarm(alarm);
        } else {
          tapTimeout = setTimeout(() => {
            tapTimeout = null;
          }, 300);
        }
      }

      function saveToLocal() { 
        localStorage.setItem('neon_alarms_mobile', JSON.stringify(alarms)); 
      }
      
      function loadFromLocal() {
        const saved = localStorage.getItem('neon_alarms_mobile');
        if (saved) { 
          try { 
            alarms = JSON.parse(saved); 
            sortAlarms(); 
          } catch(e) {
            console.warn('Failed to load alarms');
          }
        }
        renderTimeline();
        updateNextAlarmDisplay();
      }

      // Format toggle
      formatBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const fmt = btn.dataset.format;
          clockFormat = fmt;
          formatBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderTimeline();
          updateNextAlarmDisplay();
          if (document.body.classList.contains('fullscreen-active')) {
            updateDigitalClockFS();
          }
        });
      });

      // Check for scheduled alarms
      function checkScheduledAlarms() {
        const now = new Date();
        const currentTimeStr = now.toLocaleTimeString([], { 
          hour: '2-digit', minute: '2-digit', hour12: false 
        });
        
        alarms.forEach(alarm => { 
          if (alarm.start === currentTimeStr && activeAlarmId !== alarm.id) {
            startAlarm(alarm);
          }
        });
      }

      // Initialize
      if (Notification.permission === 'default') {
        Notification.requestPermission();
      }
      
      exitFullscreenBtn.addEventListener('click', () => {
        if (activeAlarmId) {
          if (confirm('Stop current session?')) {
            stopActiveAlarm();
          }
        } else {
          exitFullscreenMode();
        }
      });
      
      addBtn.addEventListener('click', addAlarm);
      
      setInterval(checkScheduledAlarms, 30000);
      loadFromLocal();
      updateActiveBadge();
      
      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
          document.body.classList.remove('fullscreen-active');
        }
      });
      
      // Re-attach listeners when timeline changes
      new MutationObserver(() => attachTimelineStartListeners())
        .observe(timelineTrack, { childList: true, subtree: true });
      
      window.addEventListener('beforeunload', () => { 
        if (timerInterval) clearInterval(timerInterval); 
      });
    })();
  </script>
</body>
</html>
