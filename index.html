<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>NEON FLOW • Mobile Fixed</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #0b0e14;
      min-height: 100vh;
      color: white;
      padding: 10px;
    }

    #app {
      max-width: 500px;
      margin: 0 auto;
    }

    .panel {
      background: rgba(18, 25, 35, 0.9);
      border: 1px solid #0ff3;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 15px;
      text-shadow: 0 0 15px cyan;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    /* Banner */
    .banner {
      background: linear-gradient(135deg, #0ff2, #3b82f62);
      border: 1px solid #0ff;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
      text-align: center;
    }

    .banner-label {
      font-size: 14px;
      opacity: 0.8;
    }

    .banner-time {
      font-size: 36px;
      font-weight: bold;
      color: #0ff;
      margin: 10px 0;
    }

    .banner-countdown {
      font-size: 42px;
      font-weight: bold;
      text-shadow: 0 0 20px cyan;
    }

    /* Active badge */
    .active-badge {
      background: #0f1a24;
      padding: 15px;
      border-radius: 40px;
      border-left: 5px solid #0ff;
      margin-bottom: 15px;
      font-size: 16px;
    }

    /* Timeline */
    .timeline-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 5px 0;
    }

    .timeline-track {
      display: flex;
      gap: 12px;
      min-width: min-content;
    }

    .alarm-card {
      background: #0f1a24;
      border-radius: 15px;
      padding: 15px;
      min-width: 150px;
      border-left: 5px solid;
    }

    .alarm-card.work { border-color: #3b82f6; }
    .alarm-card.rest { border-color: #10b981; }
    .alarm-card.sleep { border-color: #8b5cf6; }

    .card-header {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ff5e7c;
      font-size: 24px;
      padding: 5px 10px;
      cursor: pointer;
    }

    /* Form elements */
    .input-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 5px;
    }

    input, select {
      background: #0f1a24;
      border: 1px solid #2e4b62;
      color: white;
      padding: 15px;
      border-radius: 15px;
      font-size: 16px;
      width: 100%;
    }

    .category-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .cat-option {
      flex: 1;
      background: #0f1a24;
      border: 2px solid #2e4b62;
      color: white;
      padding: 15px;
      border-radius: 15px;
      font-size: 16px;
      text-align: center;
      cursor: pointer;
    }

    .cat-option.selected {
      border-color: #0ff;
      background: #0ff2;
    }

    .cat-option.work.selected { border-color: #3b82f6; background: #3b82f62; }
    .cat-option.rest.selected { border-color: #10b981; background: #10b9812; }
    .cat-option.sleep.selected { border-color: #8b5cf6; background: #8b5cf62; }

    .add-btn {
      background: #0066ff;
      border: none;
      color: white;
      padding: 18px;
      border-radius: 15px;
      font-size: 18px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 0 20px #0066ff;
    }

    .add-btn:active {
      background: #0052cc;
    }

    /* Fullscreen */
    body.fullscreen-active {
      background: black;
      padding: 0;
    }

    body.fullscreen-active #app {
      display: none;
    }

    #fullscreen-overlay {
      position: fixed;
      inset: 0;
      background: black;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
    }

    body.fullscreen-active #fullscreen-overlay {
      display: flex;
    }

    .fs-category {
      font-size: 24px;
      text-transform: uppercase;
      color: #0ff;
      margin-bottom: 20px;
    }

    .fs-clock {
      font-size: 70px;
      font-weight: 300;
      color: white;
      text-shadow: 0 0 30px cyan;
      margin-bottom: 30px;
    }

    .canvas-box {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 20px 0;
    }

    #timer-canvas {
      width: 100%;
      height: 100%;
    }

    .fs-countdown {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 50px;
      font-weight: bold;
      color: white;
      text-shadow: 0 0 30px cyan;
    }

    .exit-btn {
      background: transparent;
      border: 1px solid #555;
      color: white;
      padding: 15px 30px;
      border-radius: 15px;
      font-size: 16px;
      margin-top: 30px;
      cursor: pointer;
    }

    #flash-overlay {
      position: fixed;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 10000;
    }

    .flash {
      animation: flashAnim 0.5s;
    }

    @keyframes flashAnim {
      0%,100% { opacity: 0; }
      50% { opacity: 0.8; }
    }

    .hint {
      text-align: center;
      opacity: 0.6;
      font-size: 14px;
      margin-top: 10px;
    }

    button, .cat-option, .alarm-card, .delete-btn {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>⚡ FOCUSFLOW</h1>

    <div class="banner" id="banner">
      <div class="banner-label">NEXT ALARM</div>
      <div class="banner-time" id="nextTime">--:--</div>
      <div class="banner-countdown" id="countdown">--:--:--</div>
      <div id="nextLabel" style="margin-top:10px;">No alarms set</div>
    </div>

    <div class="active-badge" id="activeBadge">⚪ No active session</div>

    <div class="panel">
      <h2>📋 Today's Schedule</h2>
      <div class="timeline-scroll">
        <div class="timeline-track" id="timeline"></div>
      </div>
      <div class="hint">← Swipe • Tap card twice to start</div>
    </div>

    <div class="panel">
      <h2>➕ Add Alarm</h2>
      
      <div class="input-group">
        <label>Start Time</label>
        <input type="time" id="timeInput" value="09:00">
      </div>

      <div class="input-group">
        <label>Duration (minutes)</label>
        <input type="number" id="durationInput" value="25" min="1" max="480">
      </div>

      <label>Category</label>
      <div class="category-group">
        <div class="cat-option work selected" data-cat="work">💼 Work</div>
        <div class="cat-option rest" data-cat="rest">☕ Rest</div>
        <div class="cat-option sleep" data-cat="sleep">🌙 Sleep</div>
      </div>

      <div class="input-group">
        <label>Label</label>
        <input type="text" id="labelInput" value="Focus" placeholder="e.g., Study">
      </div>

      <button class="add-btn" id="addBtn">➕ ADD ALARM</button>
    </div>
  </div>

  <div id="fullscreen-overlay">
    <div class="fs-category" id="fsCat">WORK</div>
    <div class="fs-clock" id="fsClock">22:45</div>
    <div class="canvas-box">
      <canvas id="timer-canvas" width="400" height="400"></canvas>
      <div class="fs-countdown" id="fsCount">25:00</div>
    </div>
    <div id="fsNext" style="opacity:0.7;">Next: —</div>
    <button class="exit-btn" id="exitBtn">EXIT</button>
  </div>

  <div id="flash-overlay"></div>

  <script>
    (function(){
      // Simple state
      let alarms = [];
      let activeId = null;
      let timer = null;
      let currentSec = 0;
      let selectedCat = 'work';
      
      // Canvas
      const canvas = document.getElementById('timer-canvas');
      const ctx = canvas.getContext('2d');
      let rotation = 0;
      let animFrame = null;

      // Get elements
      const timeline = document.getElementById('timeline');
      const activeBadge = document.getElementById('activeBadge');
      const timeInput = document.getElementById('timeInput');
      const durationInput = document.getElementById('durationInput');
      const labelInput = document.getElementById('labelInput');
      const addBtn = document.getElementById('addBtn');
      const nextTime = document.getElementById('nextTime');
      const countdown = document.getElementById('countdown');
      const nextLabel = document.getElementById('nextLabel');
      const fsCat = document.getElementById('fsCat');
      const fsClock = document.getElementById('fsClock');
      const fsCount = document.getElementById('fsCount');
      const fsNext = document.getElementById('fsNext');
      const exitBtn = document.getElementById('exitBtn');
      const flash = document.getElementById('flash-overlay');

      // Category selection
      document.querySelectorAll('.cat-option').forEach(opt => {
        opt.addEventListener('click', function() {
          document.querySelectorAll('.cat-option').forEach(o => o.classList.remove('selected'));
          this.classList.add('selected');
          selectedCat = this.dataset.cat;
        });
        
        // Touch event
        opt.addEventListener('touchstart', function(e) {
          e.preventDefault();
        }, { passive: false });
      });

      // Format time
      function formatTime(date) {
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      }

      function parseTime(str) {
        const [h, m] = str.split(':').map(Number);
        const d = new Date();
        d.setHours(h, m, 0, 0);
        return d;
      }

      function formatCount(sec) {
        const m = Math.floor(Math.max(0, sec) / 60);
        const s = Math.max(0, sec) % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      }

      // Update banner
      function updateBanner() {
        const now = new Date();
        const upcoming = alarms.filter(a => parseTime(a.start) > now).sort((a, b) => 
          parseTime(a.start) - parseTime(b.start)
        );

        if (upcoming.length === 0) {
          nextTime.textContent = '--:--';
          countdown.textContent = '--:--:--';
          nextLabel.textContent = 'No alarms set';
          return;
        }

        const next = upcoming[0];
        const alarmTime = parseTime(next.start);
        const diff = Math.floor((alarmTime - now) / 1000);
        
        if (diff <= 0) {
          if (activeId !== next.id) startAlarm(next);
          return;
        }

        const h = Math.floor(diff / 3600);
        const m = Math.floor((diff % 3600) / 60);
        const s = diff % 60;

        nextTime.textContent = formatTime(alarmTime);
        countdown.textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        nextLabel.textContent = `${next.label} • ${next.category}`;
      }

      // Render timeline
      function renderTimeline() {
        if (alarms.length === 0) {
          timeline.innerHTML = '<div class="alarm-card" style="opacity:0.5;">No alarms</div>';
          return;
        }

        const sorted = [...alarms].sort((a, b) => parseTime(a.start) - parseTime(b.start));
        
        timeline.innerHTML = sorted.map(a => `
          <div class="alarm-card ${a.category}" data-id="${a.id}">
            <div class="card-header">
              <span>${formatTime(parseTime(a.start))}</span>
              <button class="delete-btn" data-id="${a.id}">✕</button>
            </div>
            <div>${a.label}</div>
            <div style="font-size:14px; opacity:0.7;">${a.durationMin}m</div>
          </div>
        `).join('');

        // Delete buttons
        document.querySelectorAll('.delete-btn').forEach(btn => {
          const handler = (e) => {
            e.stopPropagation();
            e.preventDefault();
            const id = Number(btn.dataset.id);
            if (confirm('Delete?')) {
              if (activeId === id) stopAlarm();
              alarms = alarms.filter(a => a.id !== id);
              renderTimeline();
              updateBanner();
              saveData();
            }
          };
          
          btn.addEventListener('click', handler);
          btn.addEventListener('touchstart', handler, { passive: false });
        });

        // Card double tap
        document.querySelectorAll('.alarm-card').forEach(card => {
          let tapCount = 0;
          
          const tapHandler = (e) => {
            if (e.target.classList.contains('delete-btn')) return;
            e.preventDefault();
            
            tapCount++;
            if (tapCount === 1) {
              setTimeout(() => { tapCount = 0; }, 300);
            } else if (tapCount === 2) {
              const id = Number(card.dataset.id);
              const alarm = alarms.find(a => a.id === id);
              if (alarm) startAlarm(alarm);
              tapCount = 0;
            }
          };
          
          card.addEventListener('click', tapHandler);
          card.addEventListener('touchstart', tapHandler, { passive: false });
        });
      }

      // Add alarm
      function addAlarm() {
        const time = timeInput.value;
        const duration = parseInt(durationInput.value);
        const label = labelInput.value.trim();

        if (!time || !duration || !label) {
          alert('Fill all fields');
          return;
        }

        alarms.push({
          id: Date.now(),
          start: time,
          durationMin: duration,
          category: selectedCat,
          label: label
        });

        renderTimeline();
        updateBanner();
        saveData();

        labelInput.value = '';
        durationInput.value = '25';
        
        addBtn.textContent = '✓ ADDED!';
        setTimeout(() => { addBtn.textContent = '➕ ADD ALARM'; }, 1000);
      }

      // Start alarm
      function startAlarm(alarm) {
        if (activeId) stopAlarm();
        
        activeId = alarm.id;
        currentSec = alarm.durationMin * 60;
        
        fsCat.textContent = `${alarm.category.toUpperCase()} • ${alarm.label}`;
        fsCount.textContent = formatCount(currentSec);
        
        document.body.classList.add('fullscreen-active');
        updateClock();
        const clockInt = setInterval(updateClock, 500);
        
        timer = setInterval(() => {
          if (currentSec <= 0) {
            clearInterval(timer);
            clearInterval(clockInt);
            endAlarm(alarm);
            return;
          }
          currentSec--;
          fsCount.textContent = formatCount(currentSec);
          activeBadge.textContent = `⚡ ${alarm.category} • ${alarm.label} • ${formatCount(currentSec)}`;
        }, 1000);

        function animate() {
          drawRing(currentSec, alarm.durationMin * 60);
          rotation += 0.012;
          animFrame = requestAnimationFrame(animate);
        }
        animate();

        activeBadge.textContent = `⚡ ${alarm.category} • ${alarm.label} • ${formatCount(currentSec)}`;
        window.clockInt = clockInt;
      }

      function updateClock() {
        const now = new Date();
        fsClock.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        
        const upcoming = alarms.filter(a => parseTime(a.start) > new Date());
        if (upcoming.length) {
          fsNext.textContent = `Next: ${formatTime(parseTime(upcoming[0].start))} • ${upcoming[0].label}`;
        }
      }

      function stopAlarm() {
        if (timer) clearInterval(timer);
        if (animFrame) cancelAnimationFrame(animFrame);
        if (window.clockInt) clearInterval(window.clockInt);
        timer = null;
        animFrame = null;
        activeId = null;
        document.body.classList.remove('fullscreen-active');
        activeBadge.textContent = '⚪ No active session';
        updateBanner();
      }

      function endAlarm(alarm) {
        flash.classList.add('flash');
        setTimeout(() => flash.classList.remove('flash'), 500);
        
        stopAlarm();
        alarms = alarms.filter(a => a.id !== alarm.id);
        renderTimeline();
        updateBanner();
        saveData();
      }

      function drawRing(current, total) {
        ctx.clearRect(0, 0, 400, 400);
        const progress = Math.max(0, 1 - (current / total));
        const cx = 200, cy = 200, r = 130;
        
        for (let i = 3; i >= 0; i--) {
          ctx.beginPath();
          ctx.arc(cx, cy, r + i * 3, 0, Math.PI * 2 * progress);
          ctx.lineWidth = 10 - i * 1.5;
          ctx.lineCap = 'round';
          
          const grad = ctx.createConicGradient(rotation + i * 0.3, cx, cy);
          grad.addColorStop(0, '#0ff');
          grad.addColorStop(0.5, '#3b82f6');
          grad.addColorStop(1, '#a78bfa');
          
          ctx.strokeStyle = grad;
          ctx.shadowColor = '#0ff';
          ctx.shadowBlur = 20 + i * 6;
          ctx.stroke();
        }
      }

      function saveData() {
        localStorage.setItem('alarms_mobile', JSON.stringify(alarms));
      }

      function loadData() {
        const saved = localStorage.getItem('alarms_mobile');
        if (saved) {
          try { alarms = JSON.parse(saved); } catch(e) {}
        }
        renderTimeline();
        updateBanner();
      }

      // Event listeners with touch support
      addBtn.addEventListener('click', (e) => {
        e.preventDefault();
        addAlarm();
      });
      
      addBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        addAlarm();
      }, { passive: false });

      exitBtn.addEventListener('click', () => {
        if (activeId) {
          if (confirm('Stop?')) stopAlarm();
        } else {
          document.body.classList.remove('fullscreen-active');
        }
      });
      
      exitBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (activeId) {
          if (confirm('Stop?')) stopAlarm();
        } else {
          document.body.classList.remove('fullscreen-active');
        }
      }, { passive: false });

      // Check alarms
      setInterval(() => {
        const now = new Date();
        const timeStr = formatTime(now);
        
        alarms.forEach(a => {
          if (a.start === timeStr && activeId !== a.id) {
            startAlarm(a);
          }
        });
        
        updateBanner();
      }, 1000);

      loadData();
    })();
  </script>
</body>
</html>
